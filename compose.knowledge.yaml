name: apologia-studio-knowledge

services:
  knowledge-postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    container_name: apologia-studio-knowledge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apologia_knowledge
      POSTGRES_USER: apologia_knowledge
      POSTGRES_PASSWORD: ${APOLOGIA_KNOWLEDGE_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - apologia_knowledge_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U apologia_knowledge -d apologia_knowledge"
        ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  apologia_knowledge_postgres_data:
