services:
  postgres:
    image: postgres:18.4-alpine
    container_name: apologia-studio-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: apologia_studio
      POSTGRES_USER: apologia
      POSTGRES_PASSWORD: ${APOLOGIA_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker

    ports:
      - "127.0.0.1:54329:5432"

    volumes:
      - apologia_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U apologia -d apologia_studio"
        ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  apologia_postgres_data:
